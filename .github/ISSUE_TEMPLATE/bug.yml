name: Bug Report
description: Report something that is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before you start, please read [CONTRIBUTING.md](https://github.com/MaxInGaussian/pi-plans/blob/main/CONTRIBUTING.md).

        Keep it short and concrete. If it does not fit on one screen, it is too long.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Be specific. Include error messages if any.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: pi-plans version
      description: e.g. 0.5.7 (from `npm ls pi-plans` or the extension directory)
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Pi version, OS, Node version, terminal, and anything else relevant.
      value: |
        - Pi version:
        - OS:
        - Node version:
        - Terminal:
    validations:
      required: false
